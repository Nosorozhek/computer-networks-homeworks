[package]
name = "lab09"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dioxus = { workspace = true }

socket2 = { version = "0.5", features = ["all"] } 
uuid = { version = "1.0", features = ["v4", "serde"] }
pnet = "0.35.0"
chrono = "0.4"

[[bin]]
name = "ip"
path = "src/ip.rs"

[[bin]]
name = "portscan"
path = "src/portscan.rs"

[[bin]]
name = "copies"
path = "src/copies.rs"
